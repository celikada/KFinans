# Secret template — production'a uygulamak icin:
#
# 1. Bu dosyayi 'secrets.yaml' olarak kopyalayin (gitignore'da)
# 2. 'CHANGE_ME' degerleri yerine gercek base64-encoded secret'larinizi yazin:
#       echo -n "your-real-value" | base64
# 3. Apply: kubectl apply -f k8s/secrets.yaml
#
# DAHA IYI ALTERNATIF (recommend): kubectl create secret generic kullanın,
# YAML dosyada base64'lu secret tutmaktan kacinin:
#
#   kubectl create secret generic kfinans-secrets \
#     --namespace=kfinans \
#     --from-literal=DATABASE_URL='postgresql+asyncpg://kfinans:<pwd>@postgres:5432/kfinans' \
#     --from-literal=SECRET_KEY='<openssl rand -hex 32 ile uretildi>' \
#     --from-literal=FERNET_KEY='<Fernet.generate_key()>' \
#     --from-literal=RESEND_API_KEY='re_xxx' \
#     --from-literal=ANTHROPIC_API_KEY='sk-ant-xxx' \
#     --from-literal=POSTGRES_PASSWORD='<strong-pwd>'
#
apiVersion: v1
kind: Secret
metadata:
  name: kfinans-secrets
  namespace: kfinans
type: Opaque
data:
  # echo -n 'postgresql+asyncpg://kfinans:STRONG_PWD@postgres:5432/kfinans' | base64
  DATABASE_URL: CHANGE_ME
  # openssl rand -hex 32 | tr -d '\n' | base64
  SECRET_KEY: CHANGE_ME
  # python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())" | tr -d '\n' | base64
  FERNET_KEY: CHANGE_ME
  # echo -n 're_xxx' | base64
  RESEND_API_KEY: CHANGE_ME
  # echo -n 'sk-ant-xxx' | base64 (opsiyonel, advisor.py icin)
  ANTHROPIC_API_KEY: CHANGE_ME
  # echo -n 'STRONG_PWD' | base64 (postgres icin ayni sifre, DATABASE_URL ile uyumlu)
  POSTGRES_PASSWORD: CHANGE_ME
