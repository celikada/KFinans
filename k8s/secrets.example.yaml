# Bu dosya örnek şablondur — git'e girmez, gerçek değerler kullanılmaz.
# Gerçek secret oluşturmak için:
#   kubectl create secret generic kfinans-secrets -n kfinans \
#     --from-literal=DATABASE_URL="postgresql+asyncpg://kfinans:SIFRE@postgres-postgresql:5432/kfinans" \
#     --from-literal=SECRET_KEY="guclu-jwt-secret" \
#     --from-literal=FERNET_KEY="base64-fernet-key" \
#     --from-literal=ANTHROPIC_API_KEY="sk-ant-..." \
#     --dry-run=client -o yaml | kubectl apply -f -
apiVersion: v1
kind: Secret
metadata:
  name: kfinans-secrets
  namespace: kfinans
type: Opaque
stringData:
  DATABASE_URL: "postgresql+asyncpg://kfinans:CHANGE_ME@postgres-postgresql:5432/kfinans"
  SECRET_KEY: "CHANGE_ME"
  FERNET_KEY: "CHANGE_ME"
  ANTHROPIC_API_KEY: ""
