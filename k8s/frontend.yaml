---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: kfinans
  labels:
    app: frontend
spec:
  type: ClusterIP
  selector:
    app: frontend
  ports:
    - port: 80
      targetPort: 3000
      name: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: kfinans
  labels:
    app: frontend
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      # FAZ H DEVOPS-002 + DEVOPS-003: PSS restricted uyumlu (frontend Dockerfile zaten nextjs:1001)
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: frontend
          # frontend/Dockerfile multi-stage build; standalone output kullanilir
          # DEVOPS-001 (FAZ H): kustomize images: transformer override eder
          image: docker.io/celikada/kfinans-frontend:v0.0.0  # placeholder
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: [ALL]
          ports:
            - containerPort: 3000
              name: http
          env:
            # NEXT_PUBLIC_API_URL build-time'da bake edilir; runtime'da etkili degil.
            # Production build'inde --build-arg NEXT_PUBLIC_API_URL=... kullanin.
            - name: NEXT_PUBLIC_API_URL
              valueFrom:
                configMapKeyRef:
                  name: kfinans-config
                  key: NEXT_PUBLIC_API_URL
            - name: HOSTNAME
              value: "0.0.0.0"
            - name: PORT
              value: "3000"
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 20
            periodSeconds: 30
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
