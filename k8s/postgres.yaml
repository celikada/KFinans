---
# Headless service for StatefulSet
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: kfinans
  labels:
    app: postgres
spec:
  clusterIP: None
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
      name: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: kfinans
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      # Audit 2026-05-21 #3: DB TLS — cert-manager Secret postgres-tls
      # initContainer cert'leri emptyDir'a kopyalar + chmod 0600 + chown 70
      # (postgres user UID Alpine). PostgreSQL daemon `ssl_key_file` 0600
      # ister (insecure mode reject).
      initContainers:
        - name: cert-prep
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              set -e
              cp /cert-src/tls.crt /cert-dst/server.crt
              cp /cert-src/tls.key /cert-dst/server.key
              chmod 0600 /cert-dst/server.key
              chmod 0644 /cert-dst/server.crt
              chown -R 70:70 /cert-dst
              ls -la /cert-dst
          # PodSecurity baseline yeterli (root entrypoint kabul); ama
          # privilege escalation engelle
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: cert-src
              mountPath: /cert-src
              readOnly: true
            - name: cert-dst
              mountPath: /cert-dst
      containers:
        - name: postgres
          image: postgres:16-alpine
          # Postgres SSL ssl_cert_file/ssl_key_file args ile aktive edilir.
          # `hba_file` default kalir — `host` ve `hostssl` her ikisini kabul
          # eder (geriye uyumlu: mevcut backend ssl=disable connect EDEBILIR
          # ama yeni baglantilarda ssl=prefer ile encrypted olur).
          args:
            - postgres
            - -c
            - ssl=on
            - -c
            - ssl_cert_file=/etc/postgres-tls/server.crt
            - -c
            - ssl_key_file=/etc/postgres-tls/server.key
            - -c
            - ssl_min_protocol_version=TLSv1.2
          ports:
            - containerPort: 5432
              name: postgres
          env:
            - name: POSTGRES_USER
              value: kfinans
            - name: POSTGRES_DB
              value: kfinans
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kfinans-secrets
                  key: POSTGRES_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
            - name: cert-dst
              mountPath: /etc/postgres-tls
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 1Gi
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "kfinans"]
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "kfinans"]
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
      volumes:
        - name: cert-src
          secret:
            secretName: postgres-tls
            defaultMode: 0444
        - name: cert-dst
          emptyDir:
            sizeLimit: 4Mi
  volumeClaimTemplates:
    - metadata:
        name: postgres-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 50Gi
        # DEVOPS-027 (FAZ H): Single-node K3s'de cluster default StorageClass
        # `local-path` (k3s built-in) kullanilir — node'a bagli, multi-node'a
        # gecildiginde pod baska node'a giderse stuck Pending olur.
        #
        # Multi-node migration plani:
        #   1. Oracle Block Storage CSI: oracle.com/storage class
        #      (cloud-managed, ReadWriteOnce, ~$1.78/TB/ay)
        #      storageClassName: oci-bv (block volume)
        #   2. Longhorn: replicated/distributed storage (3 replica default)
        #      kubectl apply -f longhorn.yaml
        #      storageClassName: longhorn
        #   3. NFS / RWX shared: Read-write-many (postgres icin DEGIL — replication
        #      yerine logical/streaming replication kullan).
        #
        # Single-node prod icin local-path kabul edilebilir (DEVOPS-009 backup +
        # DEVOPS-005 auto-rollback ile telafi); multi-node'a gecmeden once burayi
        # belirtin (uncomment + gercek class adi).
        # storageClassName: oci-bv  # Oracle Block Volume (multi-node)
        storageClassName: local-path  # K3s default — single-node Oracle
