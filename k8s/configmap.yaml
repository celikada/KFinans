# Non-secret konfigurasyon. Production'da degerleri kendi domain'lerinize gore guncelleyin.
#
# DEVOPS-018 (FAZ H): Tek host (kfinans.app) + path-based routing modeline uyarlandi.
# Ingress (k8s/ingress.yaml) /api -> backend, /* -> frontend olarak yonlendirir.
# Cross-origin yok; CSP `connect-src 'self'` yeterli; cookie scope tek domain.
apiVersion: v1
kind: ConfigMap
metadata:
  name: kfinans-config
  namespace: kfinans
data:
  # Backend
  ALGORITHM: "HS256"
  # FAZ C4: Prod'da access token TTL 30 dk (refresh rotation aktif)
  ACCESS_TOKEN_EXPIRE_MINUTES: "30"
  REFRESH_TOKEN_EXPIRE_DAYS: "7"
  SONIC_RPC_URL: "https://rpc.soniclabs.com"
  AVALANCHE_P_API_URL: "https://api.avax.network/ext/bc/P"
  AVALANCHE_C_RPC_URL: "https://api.avax.network/ext/bc/C/rpc"
  # Tek host modeli: same-origin /api cagrilarinda CORS preflight yok ama
  # www -> root 301 oncesi cross-origin atilabilir; iki entry guvenli.
  CORS_ORIGINS: '["https://kfinans.app","https://www.kfinans.app"]'
  # FAZ C3: TrustedHostMiddleware whitelist
  ALLOWED_HOSTS: '["kfinans.app","www.kfinans.app"]'
  # Audit 2026-05-22 P0 #6: DB TLS require 4. deneme.
  # Önceki 3 fail'in iki bağımsız hipotezi:
  #   1) K3s CNI/CoreDNS fresh pod podCIDR timing — wait-for-dns
  #      initContainer FQDN nslookup ile geliştirildi (commit a8cc247)
  #   2) postgres-tls Secret'ta `ca.crt` key yok (cert-manager SelfSigned
  #      issuer + standalone Certificate pattern bunu garantilemiyor) —
  #      backend.yaml volume `items.key: tls.crt -> path: ca.crt` fix
  #      (SelfSigned chain length=1, leaf = root) + optional: true
  # Hâlâ fail ederse: kubectl logs --previous deploy/backend -c
  # alembic-upgrade ile gerçek nedeni gör; sonraki epic asyncpg connection
  # retry wrapper (tenacity 5sn*5).
  DATABASE_SSL_MODE: "require"

  # E-posta (Resend) — RESEND_API_KEY secret'ta
  EMAIL_FROM: "KFinans <noreply@kfinans.app>"
  FRONTEND_URL: "https://kfinans.app"
  VERIFY_TOKEN_EXPIRE_HOURS: "24"

  # Sürüm bildirimleri: ADMIN_EMAILS girişte otomatik admin yapar (virgülle ayır).
  # RELEASE_NOTES_TOKEN secret'ta (CI X-Release-Token ile aynı değer olmalı).
  ADMIN_EMAILS: "celikada@gmail.com"

  # Claude
  CLAUDE_MODEL: "claude-sonnet-4-6"
  CLAUDE_MAX_TOKENS: "1024"

  # ARC-011 (FAZ H): Multi-replica scheduler safety.
  # Tum pod'lar default'ta scheduler'i baslatir (SCHEDULER_ENABLED=true) ama
  # job icindeki pg advisory lock sadece bir pod'un yurutmesini saglar (digerleri
  # skip). Tek leader pod ile calisilmak istenirse bu env'i sadece 1 replica'ya
  # `false` overlay ile verin (kustomize patch).
  SCHEDULER_ENABLED: "true"
  # ARC-003 (FAZ H): Haftalik snapshot job paralel kullanici sayisi.
  # 5 default — dis API rate limit altinda kalmak icin guvenli.
  SNAPSHOT_PARALLELISM: "5"

  # Frontend (build-time'da bake edilir; runtime'da etkili degil — release.yml
  # frontend Dockerfile build-arg NEXT_PUBLIC_API_URL="" ile gecmeli).
  # frontend/lib/api.ts: `${NEXT_PUBLIC_API_URL ?? "http://localhost:8000"}/api/v1`
  # Bos string -> goreceli URL `/api/v1` -> ingress /api -> backend.
  # Tek host modeli: same-origin request, CORS preflight yok.
  NEXT_PUBLIC_API_URL: ""
