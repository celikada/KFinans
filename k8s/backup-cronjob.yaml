---
# DEVOPS-009 (FAZ H): Günlük Postgres logical backup
# Audit 2026-05-21 #4: age asymmetric encryption (encryption-at-rest)
#
# Strateji:
# - Her gün 02:00 Europe/Istanbul (Pazar 23:00 snapshot cron'undan sonra)
# - pg_dump | gzip | age -r <pub-key> → PVC üzerinde 30 gün retention
# - age: asymmetric encryption — private key cluster DIŞINDA tutulur,
#   cluster compromise edilse bile yedeklerden veri okunamaz.
# - Sonraki seviye: rclone Oracle Object Storage off-site sync (ayrı PR,
#   bucket bilgisi gerekli)
#
# Restore (private key lokal'de age-key.txt'te varsayilir):
#   kubectl cp postgres-backup-pod:/backups/kfinans-YYYY-MM-DD.sql.gz.age ./local.age
#   age -d -i /path/to/age-key.txt local.age | gunzip > restore.sql
#   psql -U kfinans -d kfinans -f restore.sql
#
# Test (manuel job):
#   kubectl create job --from=cronjob/postgres-backup postgres-backup-manual -n kfinans
#
# Public key rotation: ConfigMap kfinans-backup-config içindeki AGE_PUBLIC_KEY
# güncelle. Eski encrypted dump'lar eski key ile decrypt edilir (age multi-key
# encryption pattern desteklenir — birden fazla -r flag ile encrypt sirasinda
# rotation desteklenebilir).
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: kfinans-backup-config
  namespace: kfinans
data:
  # Audit 2026-05-21 #4: age public key — yedek encryption icin.
  # Private key (AGE-SECRET-KEY-1...) cluster DIŞINDA saklanir:
  #   Lokal: C:\Users\celik\AppData\Local\Temp\kfinans-backup-age-key.txt
  #   Backup: .credentials.local.md §9 + Bitwarden/USB (3-2-1 kurali)
  # Public key dosyada plain — repo'ya commit edilebilir (encrypt only).
  AGE_PUBLIC_KEY: "age12dk6lheu7wkd4de5wkfpkg9ehrj8zsfql509lx8rgd9qqufqxygq64d5v3"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-backups
  namespace: kfinans
  labels:
    app: postgres-backup
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
  # storageClassName belirtilmedi — K3s default `local-path` kullanılır
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: postgres-backup
  namespace: kfinans
  labels:
    app: postgres-backup
spec:
  schedule: "0 23 * * *"  # 23:00 UTC = 02:00 Europe/Istanbul (DST'de 01:00 yaz)
  timeZone: "Europe/Istanbul"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            # NetworkPolicy `postgres-backup-egress` ve `postgres-ingress`
            # selector'lari icin gerekli (audit 2026-05-21 #1)
            app: postgres-backup
        spec:
          restartPolicy: OnFailure
          # PSS restricted uyumlu
          securityContext:
            runAsNonRoot: true
            runAsUser: 999  # postgres user (postgres image default)
            runAsGroup: 999
            fsGroup: 999
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: backup
              image: postgres:16-alpine
              imagePullPolicy: IfNotPresent
              # SEC HARDENING 2026-05-21: readOnlyRootFilesystem=true.
              # pg_dump | gzip | age stream'i /backups PVC'ye yazar; /tmp ara
              # buffer icin emptyDir. age binary apk install gerekiyor —
              # Alpine ROFS'ta /var/cache/apk emptyDir mount.
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: [ALL]
              env:
                - name: PGHOST
                  value: postgres
                - name: PGUSER
                  value: kfinans
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: kfinans-secrets
                      key: POSTGRES_PASSWORD
                - name: PGDATABASE
                  value: kfinans
                - name: AGE_PUBLIC_KEY
                  valueFrom:
                    configMapKeyRef:
                      name: kfinans-backup-config
                      key: AGE_PUBLIC_KEY
              command:
                - /bin/sh
                - -c
                - |
                  set -euo pipefail

                  # Audit 2026-05-21 #4: age binary GitHub release'den indir (statik Go).
                  # ROFS=true ile apk install yapamiyoruz (/usr/bin/age yaza-yok),
                  # binary'i /tmp/age'e cikar.
                  AGE_VER=v1.2.1
                  AGE_URL=https://github.com/FiloSottile/age/releases/download/${AGE_VER}/age-${AGE_VER}-linux-amd64.tar.gz
                  echo "age binary indiriyor: ${AGE_URL}"
                  wget -qO- "${AGE_URL}" | tar xz -C /tmp
                  export PATH=/tmp/age:${PATH}
                  age --version

                  TIMESTAMP=$(date +%Y-%m-%d_%H%M%S)
                  BACKUP_FILE="/backups/kfinans-${TIMESTAMP}.sql.gz.age"
                  echo "Postgres backup (age encrypted) baslıyor: ${BACKUP_FILE}"

                  # pg_dump -> gzip -> age encrypt (asymmetric, cluster-dis-private-key)
                  pg_dump --format=plain --no-owner --no-acl \
                    | gzip -9 \
                    | /tmp/age/age -r "${AGE_PUBLIC_KEY}" -o "${BACKUP_FILE}"

                  ls -lh "${BACKUP_FILE}"
                  echo "Backup tamamlandi (age encrypted, sadece private key sahibi decrypt eder)."

                  # 30 gun'den eski yedekleri temizle (eski .sql.gz formati + yeni .age)
                  echo "Eski yedekler temizleniyor (>30 gun):"
                  find /backups -name "kfinans-*.sql.gz.age" -mtime +30 -print -delete || true
                  find /backups -name "kfinans-*.sql.gz" -mtime +30 -print -delete || true

                  echo "Disk kullanimi:"
                  du -sh /backups
              resources:
                requests:
                  cpu: 100m
                  memory: 256Mi
                limits:
                  cpu: 500m
                  memory: 512Mi
              volumeMounts:
                - name: backups
                  mountPath: /backups
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: backups
              persistentVolumeClaim:
                claimName: postgres-backups
            - name: tmp
              emptyDir:
                sizeLimit: 64Mi
