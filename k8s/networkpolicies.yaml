---
# Audit 2026-05-21 #1 — Default-deny + allowlist
#
# Strateji:
# - default-deny-all: kfinans namespace'de her pod ingress + egress kapali baslar
# - allow-dns-egress: tum pod'lar kube-dns'e cikabilir (cluster icinde Service
#   resolution + harici DNS lookup icin sart)
# - app-bazli ingress/egress allow'lar: dar kaprama
#
# Risk: yanlis config -> backend pod CrashLoopBackOff (probe fail) veya
# external API call'lari (RPC, TEFAS, Yahoo, Resend, Anthropic, Sentry)
# patlar. Apply oncesi `kustomize build` + apply sonrasi IMMEDIATE smoke test.
# Rollback: `kubectl -n kfinans delete networkpolicy --all`.
#
# Probe traffic source: kubelet node IP (K3s embedded kube-router CNI'de
# pod IP'sine node IP'sinden gelir, SNAT yok). Single-node Oracle VM ip:
# 141.144.243.54 -> ipBlock allow.
#
# Kube-router NetworkPolicy controller K3s'de embedded; ek paket gerekmez.

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: kfinans
spec:
  podSelector: {}  # tum pod'lar
  policyTypes:
    - Ingress
    - Egress
  # ingress/egress array'leri yok -> deny all

---
# Tum pod'lar kube-dns'e cikabilir (Service DNS + external domain lookup)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns-egress
  namespace: kfinans
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53

---
# Backend: traefik ingress + kubelet probe (node IP)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: backend-ingress
  namespace: kfinans
spec:
  podSelector:
    matchLabels:
      app: backend
  policyTypes:
    - Ingress
  ingress:
    # Traefik ingress controller (kube-system ns)
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - protocol: TCP
          port: 8000
    # Kubelet probe (Oracle VM node IP — single-node K3s)
    # Multi-node'a gecince tum node IP'leri eklenmeli veya
    # ipBlock: cidr ile node subnet kullanilmali.
    - from:
        - ipBlock:
            cidr: 141.144.243.54/32
      ports:
        - protocol: TCP
          port: 8000

---
# Backend egress: postgres + external HTTPS/HTTP (RPC, TEFAS, Yahoo,
# CCXT exchanges, Resend, Anthropic, Sentry, OTel collector) + DNS
# (allow-dns-egress ile saglandi)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: backend-egress
  namespace: kfinans
spec:
  podSelector:
    matchLabels:
      app: backend
  policyTypes:
    - Egress
  egress:
    # Postgres internal (pod-to-pod, kfinans ns)
    - to:
        - podSelector:
            matchLabels:
              app: postgres
      ports:
        - protocol: TCP
          port: 5432
    # External internet HTTPS/HTTP (RFC1918 + link-local + cluster CIDR HARIC)
    # Cluster pod CIDR K3s default 10.42.0.0/16; service CIDR 10.43.0.0/16.
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              - 10.42.0.0/16
              - 10.43.0.0/16
              - 169.254.0.0/16
      ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 80
    # Resend SMTP (587/2587) — API kullaniliyorsa 443 yeterli
    # Bazi RPC'ler 8545/8546 (ETH JSON-RPC) — public RPC HTTPS uzerinden,
    # gerek yok. Eklenirse buraya port list.

---
# Frontend: traefik ingress + kubelet probe
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: frontend-ingress
  namespace: kfinans
spec:
  podSelector:
    matchLabels:
      app: frontend
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - protocol: TCP
          port: 3000
    - from:
        - ipBlock:
            cidr: 141.144.243.54/32
      ports:
        - protocol: TCP
          port: 3000

---
# Frontend egress: yok (Next.js standalone runtime'da external call yok;
# SSR external API call yapmiyor — NEXT_PUBLIC_API_URL boş -> browser-side).
# DNS yeterli (allow-dns-egress ile saglandi).
# Empty policy: sadece Egress policyType belirt, kural yok -> deny all egress
# disinda DNS (allow-dns-egress).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: frontend-egress-deny
  namespace: kfinans
spec:
  podSelector:
    matchLabels:
      app: frontend
  policyTypes:
    - Egress
  # egress: [] -> default-deny ile birlikte deny all (DNS allow-dns-egress
  # ile zaten saglandi; iki policy union alir)

---
# Postgres: ingress sadece backend + backup pod'larindan; egress yok
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-ingress
  namespace: kfinans
spec:
  podSelector:
    matchLabels:
      app: postgres
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: backend
        - podSelector:
            matchLabels:
              app: postgres-backup
      ports:
        - protocol: TCP
          port: 5432
    # Kubelet probe postgres icin exec (pg_isready) — TCP probe degil,
    # NetworkPolicy disinda. Network probe yok bu pod icin.

---
# Backup CronJob pod: egress sadece postgres:5432
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-backup-egress
  namespace: kfinans
spec:
  podSelector:
    matchLabels:
      app: postgres-backup
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: postgres
      ports:
        - protocol: TCP
          port: 5432
