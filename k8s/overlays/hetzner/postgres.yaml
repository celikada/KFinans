---
# Sadelestirilmis Postgres (Hetzner ilk deploy) — TLS YOK.
# Base k8s/postgres.yaml in-cluster TLS (postgres-tls cert + ssl=on) kullanir;
# tek node + ClusterIP'de bu gereksiz karmasiklik (Oracle'da sorun cikardi).
# Hardening fazinda base'e geri donulebilir.
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: kfinans
  labels:
    app: postgres
spec:
  clusterIP: None
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
      name: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: kfinans
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
              name: postgres
          env:
            - name: POSTGRES_USER
              value: kfinans
            - name: POSTGRES_DB
              value: kfinans
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kfinans-secrets
                  key: POSTGRES_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 1Gi
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "kfinans"]
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "kfinans"]
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
  volumeClaimTemplates:
    - metadata:
        name: postgres-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 20Gi
        storageClassName: local-path  # k3s built-in (node-local)
