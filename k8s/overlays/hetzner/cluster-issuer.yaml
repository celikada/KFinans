---
# Let's Encrypt production issuer (HTTP-01 via Traefik).
# DNS kfinans.app -> bu node IP'sine yonlendikten SONRA cert otomatik uretilir.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: celikada@gmail.com
    privateKeySecretRef:
      name: letsencrypt-prod-account-key
    solvers:
      - http01:
          ingress:
            class: traefik
