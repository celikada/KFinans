apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: kfinans
  labels:
    app: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: ghcr.io/celikada/kfinans-backend:latest
          ports:
            - containerPort: 8000
          envFrom:
            - secretRef:
                name: kfinans-secrets
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: kfinans-secrets
                  key: DATABASE_URL
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
      initContainers:
        - name: migrate
          image: ghcr.io/celikada/kfinans-backend:latest
          command: ["alembic", "upgrade", "head"]
          envFrom:
            - secretRef:
                name: kfinans-secrets
