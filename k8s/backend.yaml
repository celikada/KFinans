---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: kfinans
  labels:
    app: backend
spec:
  type: ClusterIP
  selector:
    app: backend
  ports:
    - port: 80
      targetPort: 8000
      name: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: kfinans
  labels:
    app: backend
spec:
  # SEC-003 (FAZ H): replicas=2 -> 1 dusuruldu. slowapi MemoryStorage default'tu;
  # 2 replica saldirgana 2x kota verir (login 10/dk -> 20/dk). Redis backend
  # ekleninceye kadar (Faz I) replicas=1 kalir; Redis enable edilince
  # REDIS_URL configmap'e set edilip replicas tekrar 2+'ya cikarilir.
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      # FAZ H DEVOPS-002 + DEVOPS-003: Pod Security Standards (restricted) uyumlu
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      # Yeni pod start edince Alembic migration calistirir, sonra uvicorn baslar.
      # Replica 2 oldugu icin migration ayni anda iki kez calisabilir; alembic
      # transactional DDL kullaniyor (PostgresqlImpl), idempotent — sorun yok.
      initContainers:
        - name: alembic-upgrade
          # DEVOPS-001 (FAZ H): kustomize images: transformer ile semver tag set edilir
          image: docker.io/celikada/kfinans-backend:v0.0.0  # placeholder; kustomize override eder
          imagePullPolicy: IfNotPresent
          # PodSecurity "restricted" namespace icin initContainer'da da
          # container-level guvenlik ayarlari zorunlu. Pod-level securityContext
          # (runAsNonRoot/User/Group) miras alinir ama allowPrivilegeEscalation
          # ve capabilities her container'da ayri set edilmeli.
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: [ALL]
          command: ["alembic", "upgrade", "head"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: kfinans-secrets
                  key: DATABASE_URL
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: kfinans-secrets
                  key: SECRET_KEY
            - name: FERNET_KEY
              valueFrom:
                secretKeyRef:
                  name: kfinans-secrets
                  key: FERNET_KEY
      containers:
        - name: backend
          image: docker.io/celikada/kfinans-backend:v0.0.0  # placeholder; kustomize override eder
          imagePullPolicy: IfNotPresent
          # DEVOPS-002: Container-level security
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false  # Python pip cache + tmp ihtiyacı
            capabilities:
              drop: [ALL]
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: kfinans-config
            - secretRef:
                name: kfinans-secrets
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          # FAZ C3 TrustedHostMiddleware ALLOWED_HOSTS=["kfinans.app","www.kfinans.app"]
          # ile sikilastirilmis durumda. Kubelet probe'lari default'ta `Host: <pod-ip>`
          # gonderir; whitelist'te olmadigi icin 400 doner. httpHeaders.Host override
          # ile probe'lar uretim host'unu taklit eder. Bu Oracle'da ALLOWED_HOSTS=["*"]
          # workaround'unu kaldirip sikilastirma yapmanin ones-kosulu.
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
              httpHeaders:
                - name: Host
                  value: kfinans.app
            initialDelaySeconds: 20
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
              httpHeaders:
                - name: Host
                  value: kfinans.app
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 2
          startupProbe:
            httpGet:
              path: /health
              port: 8000
              httpHeaders:
                - name: Host
                  value: kfinans.app
            initialDelaySeconds: 0
            periodSeconds: 5
            failureThreshold: 30  # 150sn'ye kadar startup'a izin ver (cold start)
