---
# Backend pod'dan: postgres:5432 + external HTTPS/HTTP + DNS (allow-dns-egress dahil)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: backend-egress
  namespace: kfinans
spec:
  podSelector:
    matchLabels:
      app: backend
  policyTypes:
    - Egress
  egress:
    # Postgres internal
    - to:
        - podSelector:
            matchLabels:
              app: postgres
      ports:
        - protocol: TCP
          port: 5432
    # External HTTPS/HTTP (RPC, TEFAS, Yahoo, CCXT, Resend, Anthropic, Sentry, OTel)
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              - 10.42.0.0/16     # Cluster pod CIDR HARIC (intra-namespace deny)
      ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 80
