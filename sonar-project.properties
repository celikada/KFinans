# SonarCloud konfigurasyonu — KFinans
# Kullanim: SonarCloud organizasyonu "celikada", proje key "celikada_KFinans"
# Workflow: .github/workflows/sonar.yml

sonar.projectKey=celikada_KFinans
sonar.organization=celikada
sonar.projectName=KFinans
sonar.projectVersion=0.1.0

# ─── Modül kaynakları ────────────────────────────────────────────────────────
# Tek modul yapisi: backend (Python) + frontend (TypeScript) tek projede analiz edilir.
sonar.sources=backend/app,frontend/app,frontend/lib
sonar.tests=backend/tests,frontend/__tests__,frontend/playwright

# ─── Dil ayarları ────────────────────────────────────────────────────────────
sonar.python.version=3.12
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info
sonar.python.coverage.reportPaths=backend/coverage.xml
sonar.python.xunit.reportPath=backend/junit.xml

# ─── Hariç tutulanlar (analiz dışı) ──────────────────────────────────────────
# Migration'lar (Alembic generated), __pycache__, build artifact'leri, public asset'ler.
sonar.exclusions=\
    **/__pycache__/**,\
    **/migrations/**,\
    backend/alembic/versions/**,\
    backend/.venv/**,\
    backend/.pytest_cache/**,\
    backend/.ruff_cache/**,\
    backend/dist/**,\
    backend/build/**,\
    backend/*.egg-info/**,\
    frontend/.next/**,\
    frontend/node_modules/**,\
    frontend/coverage/**,\
    frontend/playwright-report/**,\
    frontend/test-results/**,\
    frontend/public/**,\
    docs/**,\
    k8s/**,\
    **/*.min.js,\
    **/*.min.css

# ─── Coverage hariç tutulanlar (bu dosyalar coverage'a sayılmaz) ────────────
# Test'ler, config dosyaları, schema/dto/event tanımları (data class'lar test edilmez).
sonar.coverage.exclusions=\
    backend/tests/**,\
    backend/alembic/**,\
    backend/app/main.py,\
    backend/app/config.py,\
    backend/app/models/**,\
    backend/app/schemas/**,\
    backend/app/api/v1/router.py,\
    backend/app/scheduler.py,\
    frontend/__tests__/**,\
    frontend/playwright/**,\
    frontend/app/_components/Logos*.tsx,\
    frontend/app/layout.tsx,\
    frontend/app/page.tsx,\
    frontend/lib/format.ts,\
    frontend/proxy.ts,\
    frontend/next.config.ts,\
    frontend/app/sw.ts,\
    frontend/scripts/**,\
    **/*.config.ts,\
    **/*.config.mjs

# ─── Duplicate detection ─────────────────────────────────────────────────────
sonar.cpd.exclusions=\
    backend/tests/**,\
    frontend/__tests__/**,\
    frontend/playwright/**,\
    backend/alembic/versions/**

# ─── Encoding ────────────────────────────────────────────────────────────────
sonar.sourceEncoding=UTF-8

# ─── PR analiz ────────────────────────────────────────────────────────────────
# PR decoration GitHub Actions tarafindan otomatik enjekte edilir.
# sonar.pullrequest.* parametreleri sonar-scanner-action ile dolar.
