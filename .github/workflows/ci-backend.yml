name: CI — Backend

on:
  push:
    branches: [main, develop, "feature/**", "fix/**", "hotfix/**"]
    paths:
      - "backend/**"
      - ".github/workflows/ci-backend.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "backend/**"
      - ".github/workflows/ci-backend.yml"
  workflow_dispatch:

concurrency:
  group: ci-backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Bağımlılıkları kur
        working-directory: backend
        run: pip install -e ".[dev]"
      - name: ruff check
        working-directory: backend
        run: ruff check .
      - name: ruff format
        working-directory: backend
        run: ruff format --check .

  unit-tests:
    name: Unit testler
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Bağımlılıkları kur
        working-directory: backend
        run: pip install -e ".[dev]"
      - name: Test secret'larını üret
        run: |
          echo "SECRET_KEY=$(openssl rand -hex 32)" >> $GITHUB_ENV
          echo "FERNET_KEY=$(python -c 'from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())')" >> $GITHUB_ENV
      - name: pytest unit (coverage)
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://kfinans:kfinans_test@localhost:5432/kfinans_test
        run: pytest tests/unit --cov=app --cov-report=xml --cov-report=term-missing
      - name: Coverage XML upload
        uses: actions/upload-artifact@v4
        with:
          name: coverage-unit
          path: backend/coverage.xml
          retention-days: 7

  integration-tests:
    name: Integration testler (real PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: kfinans
          POSTGRES_PASSWORD: kfinans_test
          POSTGRES_DB: kfinans_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U kfinans"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Bağımlılıkları kur
        working-directory: backend
        run: pip install -e ".[dev]"
      - name: Test secret'larını üret
        run: |
          echo "SECRET_KEY=$(openssl rand -hex 32)" >> $GITHUB_ENV
          echo "FERNET_KEY=$(python -c 'from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())')" >> $GITHUB_ENV
      - name: pytest integration (coverage)
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://kfinans:kfinans_test@localhost:5432/kfinans_test
          ANTHROPIC_API_KEY: sk-ant-test-placeholder
        run: pytest tests/integration --cov=app --cov-report=xml --cov-report=term-missing --cov-append
      - name: Coverage XML upload
        uses: actions/upload-artifact@v4
        with:
          name: coverage-integration
          path: backend/coverage.xml
          retention-days: 7

  coverage-gate:
    name: Coverage gate
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests]
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: pip install coverage
        run: pip install coverage
      - name: Coverage artifact'larını indir
        uses: actions/download-artifact@v4
        with:
          pattern: coverage-*
          path: coverage-reports
          merge-multiple: false
      - name: Coverage rapor (line + branch + critical path)
        run: |
          # TEST-007 (FAZ H): Coverage gate genisletildi.
          #   - Genel line-rate %60 (Faz H ile Faz 2.5 %50'den yukseltildi)
          #   - Branch-rate %50 (kosullu mantiklarda kapsam dogrulanir)
          #   - Critical path (auth, security, masking) %90
          # Faz 3'te genel hedef %70'e cekilecek.
          python <<'EOF'
          import xml.etree.ElementTree as ET
          from pathlib import Path

          # Genel coverage (en iyi XML)
          totals_line = []
          totals_branch = []
          critical_path_lines = {}
          # Critical path dosyalari — yuksek hedef gate
          CRITICAL_FILES = (
              "app/core/security.py",
              "app/api/v1/auth.py",
              "app/core/masking.py",
          )

          for xml in Path("coverage-reports").rglob("coverage.xml"):
              root = ET.parse(xml).getroot()
              line_rate = float(root.attrib.get("line-rate", 0)) * 100
              branch_rate = float(root.attrib.get("branch-rate", 0)) * 100
              totals_line.append(line_rate)
              totals_branch.append(branch_rate)
              print(f"  {xml}: line=%{line_rate:.2f} branch=%{branch_rate:.2f}")

              # Critical path'lerin per-file line-rate'i
              for cls in root.iter("class"):
                  filename = cls.attrib.get("filename", "")
                  for cf in CRITICAL_FILES:
                      if filename.endswith(cf):
                          rate = float(cls.attrib.get("line-rate", 0)) * 100
                          critical_path_lines[cf] = max(critical_path_lines.get(cf, 0), rate)

          if not totals_line:
              print("UYARI: coverage XML bulunamadi")
              exit(0)

          best_line = max(totals_line)
          best_branch = max(totals_branch) if totals_branch else 0
          LINE_THRESHOLD = 60.0
          BRANCH_THRESHOLD = 50.0
          CRITICAL_THRESHOLD = 90.0

          print(f"\nEn iyi line coverage: %{best_line:.2f} (hedef: %{LINE_THRESHOLD})")
          print(f"En iyi branch coverage: %{best_branch:.2f} (hedef: %{BRANCH_THRESHOLD})")

          failed = False
          if best_line < LINE_THRESHOLD:
              print(f"X Line coverage %{LINE_THRESHOLD} altina dustu")
              failed = True

          # Branch gate sadece raporlanmis ise zorlanir (XML'de attribute yoksa skip)
          if any(t > 0 for t in totals_branch) and best_branch < BRANCH_THRESHOLD:
              print(f"X Branch coverage %{BRANCH_THRESHOLD} altina dustu")
              failed = True

          # Critical path: bulunmayan dosya UYARI (henuz test yok); bulunan dusukse FAIL
          for cf in CRITICAL_FILES:
              if cf in critical_path_lines:
                  rate = critical_path_lines[cf]
                  status = "OK" if rate >= CRITICAL_THRESHOLD else "X"
                  print(f"  {status} {cf}: %{rate:.2f} (hedef: %{CRITICAL_THRESHOLD})")
                  if rate < CRITICAL_THRESHOLD:
                      failed = True
              else:
                  print(f"  ! {cf}: coverage XML'de bulunamadi (test koselerinde olmayabilir)")

          if failed:
              print("\nX Coverage gate FAIL")
              exit(1)
          print("\nOK Coverage gate gecti")
          EOF
