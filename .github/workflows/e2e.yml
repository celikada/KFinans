name: E2E — Playwright

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Playwright (login, dashboard, holdings)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: kfinans
          POSTGRES_PASSWORD: kfinans_test
          POSTGRES_DB: kfinans_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U kfinans"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Backend bağımlılıkları
        working-directory: backend
        run: pip install -e ".[dev]"

      - name: Test secret'larını üret
        run: |
          echo "SECRET_KEY=$(openssl rand -hex 32)" >> $GITHUB_ENV
          echo "FERNET_KEY=$(python -c 'from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())')" >> $GITHUB_ENV

      - name: Migration uygula
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://kfinans:kfinans_test@localhost:5432/kfinans_test
        run: alembic upgrade head

      - name: Backend'i background'da başlat
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://kfinans:kfinans_test@localhost:5432/kfinans_test
        run: |
          uvicorn app.main:app --host 0.0.0.0 --port 8000 &
          # health endpoint hazır olana kadar bekle (max 30 sn)
          for i in {1..30}; do
            if curl -sf http://localhost:8000/health; then
              echo "✅ Backend hazır"
              break
            fi
            sleep 1
          done

      - name: Frontend bağımlılıkları
        working-directory: frontend
        run: npm ci

      - name: Playwright tarayıcılarını kur
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Frontend'i build edip background'da başlat
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
        run: |
          npm run build
          npm start &
          for i in {1..30}; do
            if curl -sf http://localhost:3000; then
              echo "✅ Frontend hazır"
              break
            fi
            sleep 1
          done

      - name: Playwright testlerini çalıştır
        working-directory: frontend
        run: npx playwright test

      - name: Playwright raporunu yükle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

      - name: Test trace'lerini yükle (sadece fail durumunda)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: frontend/test-results/
          retention-days: 7
