name: CI

on:
  push:
    branches: [main, develop, "feature/**", "fix/**"]
  pull_request:
    branches: [main, develop]

jobs:
  backend:
    name: Backend — lint & test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: kfinans
          POSTGRES_PASSWORD: kfinans_test
          POSTGRES_DB: kfinans_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U kfinans"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Bağımlılıkları kur
        working-directory: backend
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        working-directory: backend
        run: |
          ruff check .
          ruff format --check .

      - name: Test ortamı hazırla
        run: |
          echo "SECRET_KEY=$(openssl rand -hex 32)" >> $GITHUB_ENV
          echo "FERNET_KEY=$(python -c 'from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())')" >> $GITHUB_ENV

      - name: Unit testler
        working-directory: backend
        run: pytest tests/unit -v
        env:
          DATABASE_URL: postgresql+asyncpg://kfinans:kfinans_test@localhost:5432/kfinans_test

      - name: Entegrasyon testleri
        working-directory: backend
        run: pytest tests/integration -v
        env:
          DATABASE_URL: postgresql+asyncpg://kfinans:kfinans_test@localhost:5432/kfinans_test
          ANTHROPIC_API_KEY: sk-ant-test-placeholder

  frontend:
    name: Frontend — lint & build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Bağımlılıkları kur
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Build
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
        run: npm run build
