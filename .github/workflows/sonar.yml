name: SonarCloud — Kod Kalitesi

# ─── Tetikleyici ─────────────────────────────────────────────────────────────
# develop push + main/develop'a PR + manuel.
# Release pipeline'inda da quality gate olarak cagrilir (release.yml -> needs).
on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

concurrency:
  group: sonar-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── Job 1: Backend coverage uretimi ──────────────────────────────────────
  backend-coverage:
    name: Backend coverage (pytest + cobertura XML)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: kfinans
          POSTGRES_PASSWORD: kfinans_test
          POSTGRES_DB: kfinans_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U kfinans"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Sonar SCM blame icin tam history

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Bağımlılıkları kur
        working-directory: backend
        run: pip install -e ".[dev]"

      - name: Test secret'larını üret
        run: |
          echo "SECRET_KEY=$(openssl rand -hex 32)" >> $GITHUB_ENV
          echo "FERNET_KEY=$(python -c 'from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())')" >> $GITHUB_ENV

      - name: pytest unit + integration (coverage XML)
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://kfinans:kfinans_test@localhost:5432/kfinans_test
          ANTHROPIC_API_KEY: sk-ant-test-placeholder
        run: |
          pytest tests/ \
            --cov=app \
            --cov-report=xml:coverage.xml \
            --cov-report=term-missing \
            --junit-xml=junit.xml \
            -v

      - name: Coverage + junit artifact upload
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: |
            backend/coverage.xml
            backend/junit.xml
          retention-days: 1

  # ─── Job 2: Frontend coverage uretimi ─────────────────────────────────────
  frontend-coverage:
    name: Frontend coverage (vitest + LCOV)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Bağımlılıkları kur
        working-directory: frontend
        run: npm ci

      - name: vitest coverage (LCOV)
        working-directory: frontend
        run: npm run test:coverage

      - name: Coverage artifact upload
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage/lcov.info
          retention-days: 1

  # ─── Job 3: SonarCloud analiz + quality gate ──────────────────────────────
  sonar:
    name: SonarCloud analiz + quality gate
    runs-on: ubuntu-latest
    needs: [backend-coverage, frontend-coverage]
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Sonar blame icin

      # Backend coverage XML'i indir (sonar-project.properties bunu bekliyor)
      - name: Backend coverage indir
        uses: actions/download-artifact@v4
        with:
          name: backend-coverage
          path: backend

      # Frontend LCOV indir
      - name: Frontend coverage indir
        uses: actions/download-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage

      # Sonar cache (analiz hizini artirir)
      - name: SonarCloud cache
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      # Resmi sonarsource action — quality gate dahil
      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          # PR analiz parametrelerini action otomatik enjekte ediyor.
          # sonar-project.properties dosyasi kokte bulunmali.
          args: >
            -Dsonar.host.url=https://sonarcloud.io
            -Dsonar.qualitygate.wait=true

      # Quality gate sonucunu logla (action zaten fail eder, bu sadece gorunurluk)
      - name: Quality gate sonucu
        if: always()
        run: echo "Sonar analiz tamamlandi. Detaylar SonarCloud arayuzunde."
