name: Release — Build, Push & Deploy to Oracle

# ─── Tetikleyici ─────────────────────────────────────────────────────────────
# v1.0.0, v1.2.3 gibi semver tag push'larinda otomatik calisir.
# main branch uzerinde olusturulan tag'ler kabul edilir.
# Manuel tetikleme: Actions sekmesinden "Run workflow" + tag.
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Deploy edilecek tag (orn: v1.0.0)'
        required: true
        default: 'v1.0.0'

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/celikada/kfinans
  ORACLE_HOST: 141.144.243.54
  ORACLE_USER: ubuntu
  K8S_NAMESPACE: kfinans
  REPO_PATH: ~/kfinans  # Oracle VM'de git clone konumu

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false  # Release'ler atomik tutulmali

jobs:
  # ─── Job 0: SonarCloud Quality Gate ──────────────────────────────────────────
  # Release'i baslatmadan once kod kalitesinin gecerli oldugunu dogrula.
  # NOT: ENABLE_SONAR=false iken atlanir; build-and-push job'i `needs` ile
  # bagli olsa da bu job skip ederse pipeline devam eder (success: skipped).
  sonar-quality-gate:
    name: SonarCloud Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: ${{ vars.ENABLE_SONAR == 'true' }}

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: kfinans
          POSTGRES_PASSWORD: kfinans_test
          POSTGRES_DB: kfinans_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U kfinans"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Backend bağımlılıkları
        working-directory: backend
        run: pip install -e ".[dev]"

      - name: Frontend bağımlılıkları
        working-directory: frontend
        run: npm ci

      - name: Test secret'larını üret
        run: |
          echo "SECRET_KEY=$(openssl rand -hex 32)" >> $GITHUB_ENV
          echo "FERNET_KEY=$(python -c 'from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())')" >> $GITHUB_ENV

      - name: Backend coverage
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://kfinans:kfinans_test@localhost:5432/kfinans_test
          ANTHROPIC_API_KEY: sk-ant-test-placeholder
        run: pytest tests/ --cov=app --cov-report=xml:coverage.xml --junit-xml=junit.xml

      - name: Frontend coverage
        working-directory: frontend
        run: npm run test:coverage

      - name: SonarCloud cache
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar-release
          restore-keys: ${{ runner.os }}-sonar

      - name: SonarCloud Scan + Quality Gate
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.host.url=https://sonarcloud.io
            -Dsonar.qualitygate.wait=true

  # ─── Job 1: Docker Image Build & Push ────────────────────────────────────────
  # Sonar job skip ederse (ENABLE_SONAR=false) bu job devam eder.
  # Sonar fail ederse durur — kalite gate'i blocker olur (ENABLE_SONAR=true iken).
  build-and-push:
    name: Build & Push — ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: sonar-quality-gate
    if: ${{ always() && needs.sonar-quality-gate.result != 'failure' }}
    timeout-minutes: 30

    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - service: backend
            context: ./backend
            dockerfile: ./backend/Dockerfile
            target: production
          - service: frontend
            context: ./frontend
            dockerfile: ./frontend/Dockerfile
            target: ""  # Frontend Dockerfile single-stage (target yok)

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Resolve version tag
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT
          fi

      - name: Build & push (${{ matrix.service }})
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          platforms: linux/amd64  # Oracle Cloud AMD64
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-${{ matrix.service }}:latest
            ${{ env.IMAGE_PREFIX }}-${{ matrix.service }}:${{ steps.version.outputs.tag }}
          # DEVOPS-018 (FAZ H): Frontend build-time NEXT_PUBLIC_API_URL bake.
          # Bos string -> goreceli /api/v1 (same-origin, ingress /api -> backend).
          # Backend icin etkisi yok (Dockerfile ARG kullanmiyor).
          build-args: |
            NEXT_PUBLIC_API_URL=
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.version.outputs.tag }}
            org.opencontainers.image.licenses=Apache-2.0
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  # ─── Job 2: Trivy Image Scan (build sonrasi) ─────────────────────────────────
  # Image'lar GHCR'a push edildikten sonra HIGH/CRITICAL CVE taramasi yapilir.
  # Fail durumunda deploy durur (deploy job'i bu job'a needs ile bagli).
  trivy-scan:
    name: Trivy Image Scan — ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: build-and-push
    timeout-minutes: 15

    strategy:
      fail-fast: true  # Bir image vulnerable ise digerini de tarayip total durdur
      matrix:
        service: [backend, frontend]

    steps:
      - uses: actions/checkout@v4

      - name: Resolve version tag
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT
          fi

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Trivy image scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.IMAGE_PREFIX }}-${{ matrix.service }}:${{ steps.version.outputs.tag }}
          format: 'sarif'
          output: 'trivy-${{ matrix.service }}.sarif'
          severity: 'HIGH,CRITICAL'
          exit-code: '1'  # HIGH/CRITICAL bulunursa fail
          ignore-unfixed: true  # Fix yokken alarm verme

      - name: Trivy SARIF rapor upload
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-${{ matrix.service }}.sarif'
          category: trivy-${{ matrix.service }}

  # ─── Job 3: Oracle Cloud K3s Deploy ─────────────────────────────────────────
  deploy:
    name: Deploy to Oracle Cloud (kfinans namespace)
    runs-on: ubuntu-latest
    needs: trivy-scan
    timeout-minutes: 20

    environment:
      name: production
      url: https://kfinans.app

    steps:
      - uses: actions/checkout@v4

      - name: Resolve version tag
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT
          fi

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.ORACLE_SSH_KEY }}" > ~/.ssh/oracle.key
          chmod 600 ~/.ssh/oracle.key
          ssh-keyscan -H ${{ env.ORACLE_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Repo'yu Oracle VM'de guncelle
        run: |
          ssh -i ~/.ssh/oracle.key ${{ env.ORACLE_USER }}@${{ env.ORACLE_HOST }} \
            "cd ${{ env.REPO_PATH }} && git fetch --all --tags && git checkout ${{ steps.version.outputs.tag }}"

      - name: K8s image tag'lerini set et + atomic apply (DEVOPS-001+004 fix)
        run: |
          # FAZ H: kustomize images: transformer ile semver tag set + tek atomic apply
          # Eski yöntem (kubectl set image race) yerine: edit + apply
          ssh -o ServerAliveInterval=30 -o ServerAliveCountMax=20 \
            -i ~/.ssh/oracle.key ${{ env.ORACLE_USER }}@${{ env.ORACLE_HOST }} "
            cd ${{ env.REPO_PATH }}/k8s
            TAG=${{ steps.version.outputs.tag }}

            # kustomize binary check (k3s ile gelir, yoksa kubectl kustomize var)
            if command -v kustomize >/dev/null 2>&1; then
              kustomize edit set image \\
                ghcr.io/celikada/kfinans-backend=ghcr.io/celikada/kfinans-backend:\$TAG \\
                ghcr.io/celikada/kfinans-frontend=ghcr.io/celikada/kfinans-frontend:\$TAG
              cd .. && sudo kubectl apply -k k8s/
            else
              # Fallback: kubectl kustomize stdout > file > apply
              cd ..
              sudo kubectl apply -k k8s/
              # Sonra set image (eski yöntem fallback)
              for svc in backend frontend; do
                sudo kubectl set image deployment/\$svc \\
                  \$svc=ghcr.io/celikada/kfinans-\$svc:\$TAG \\
                  -n ${{ env.K8S_NAMESPACE }} \\
                  || echo \"WARNING: deployment/\$svc bulunamadi (ilk deploy?)\"
              done
            fi
          "

      - name: Rollout durumunu bekle (max 6 dk) + fail durumunda otomatik rollback (DEVOPS-005)
        run: |
          ssh -o ServerAliveInterval=30 -o ServerAliveCountMax=20 \
            -i ~/.ssh/oracle.key ${{ env.ORACLE_USER }}@${{ env.ORACLE_HOST }} "
            for svc in backend frontend; do
              echo \"Waiting for \$svc rollout...\"
              if ! sudo kubectl rollout status deployment/\$svc \\
                  -n ${{ env.K8S_NAMESPACE }} --timeout=360s; then
                echo \"::error::\$svc rollout timeout — UNDO çalıştırıyor\"
                sudo kubectl rollout undo deployment/\$svc -n ${{ env.K8S_NAMESPACE }} || true
                exit 1
              fi
            done
          "

      - name: Pod ve image durumu özeti
        if: always()
        run: |
          ssh -i ~/.ssh/oracle.key ${{ env.ORACLE_USER }}@${{ env.ORACLE_HOST }} "
            echo '=== Pod Durumu ==='
            sudo kubectl get pods -n ${{ env.K8S_NAMESPACE }} -o wide
            echo ''
            echo '=== Calisan Image Versiyonlari ==='
            sudo kubectl get pods -n ${{ env.K8S_NAMESPACE }} \
              -o jsonpath='{range .items[*]}{.metadata.name}{\"\\t\"}{.spec.containers[0].image}{\"\\n\"}{end}'
            echo ''
            echo '=== Son Olaylar (failed) ==='
            sudo kubectl get events -n ${{ env.K8S_NAMESPACE }} \
              --field-selector type=Warning --sort-by='.lastTimestamp' | tail -10
          "

  # ─── Job 4: Production Smoke Test ──────────────────────────────────────────
  # Deploy basarili olduktan sonra 3-5 kritik akisi production'da dogrula.
  # Bu suite uzun degildir (~1 dk), sadece "tamamen down" senaryolarini yakalar.
  smoke-test:
    name: Smoke Test — Production
    runs-on: ubuntu-latest
    needs: deploy
    timeout-minutes: 10
    if: always() && needs.deploy.result == 'success'

    environment:
      name: production
      url: https://kfinans.app

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend bağımlılıkları
        working-directory: frontend
        run: npm ci

      - name: Playwright Chromium kur
        working-directory: frontend
        run: npx playwright install chromium --with-deps

      # DEPLOY-001 (FAZ H): Curl-based smoke gate — Playwright'tan ONCE.
      # 4 hizli check (~5 sn): backend up + DB chain + security headers + cert.
      # Frontend up ama backend down ise Playwright sahte yesil verir; bu gate engeller.
      - name: Curl smoke gate (backend health + auth + headers + cert)
        run: |
          set -euo pipefail
          BASE="https://kfinans.app"
          # Production ingress: kfinans.app -> backend service (path-based /api -> backend)
          # Health endpoint backend root'unda (/health, prefix yok — bkz: app/main.py).
          # Ingress /health -> backend gerekiyor; eksik ise bu check fail eder, deploy gate.
          API="${BASE}/api/v1"

          echo "=== 1) Frontend up check ==="
          curl -fsS -o /dev/null -w "frontend HTTP %{http_code} ssl_verify=%{ssl_verify_result}\n" "$BASE"

          echo "=== 2) Backend health check ==="
          health=$(curl -fsS "${BASE}/health")
          echo "$health"
          echo "$health" | grep -q '"status":"ok"' || (echo "::error::backend /health JSON beklenmedik" && exit 1)

          echo "=== 3) Auth chain smoke (DB + endpoint + slowapi) ==="
          # Bogus creds -> 401 (DB lookup yapildi, password mismatch). 5xx ise DB/auth kirik.
          status=$(curl -s -o /dev/null -w "%{http_code}" -X POST "${API}/auth/login" \
            -H "Content-Type: application/json" \
            -d '{"email":"smoke-bogus@kfinans.app","password":"wrong-pass-123"}')
          echo "auth/login bogus -> HTTP $status"
          if [ "$status" != "401" ]; then
            echo "::error::auth/login bogus 401 bekleniyor, gelen $status (DB veya endpoint kirik?)"
            exit 1
          fi

          echo "=== 4) Security headers smoke ==="
          headers=$(curl -sI "$BASE")
          echo "$headers" | grep -qi "strict-transport-security" || (echo "::error::HSTS header eksik" && exit 1)
          echo "$headers" | grep -qi "x-frame-options" || (echo "::error::X-Frame-Options eksik" && exit 1)
          echo "$headers" | grep -qi "content-security-policy" || (echo "::error::CSP eksik" && exit 1)
          echo "Security headers OK (HSTS + X-Frame + CSP)"

          echo "=== Curl smoke gate PASSED ==="

      - name: Smoke test sayisini dogrula (TEST-009 fix)
        working-directory: frontend
        run: |
          # @smoke etiketi olan en az 1 test bulunmali; aksi halde gate sahte yesildir
          count=$(npx playwright test --grep @smoke --list 2>&1 | grep -E "^\s+[0-9]+\s" | wc -l)
          echo "@smoke etiketli test sayisi: $count"
          if [ "$count" -lt 1 ]; then
            echo "::error::No @smoke tagged tests found — release smoke gate would be falsely green"
            exit 1
          fi

      - name: Smoke test calistir (production)
        working-directory: frontend
        env:
          BASE_URL: https://kfinans.app
          API_BASE_URL: https://kfinans.app/api  # path-based ingress (Faz D1)
        run: |
          # Sadece smoke etiketli testleri calistir
          # Smoke suite: login sayfa erisilebilirligi + token'siz /dashboard yonlendirme
          npx playwright test --grep @smoke --reporter=github

      - name: Test raporu artifact'i
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-smoke-${{ github.ref_name }}
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 14

  # ─── Job 5: Release Notes ──────────────────────────────────────────────────
  # Tag push'larinda otomatik GitHub Release olustur (changelog ile).
  # workflow_dispatch'te calismaz (manuel tetikleme tag uretmiyor).
  github-release:
    name: GitHub Release notu olustur
    runs-on: ubuntu-latest
    needs: smoke-test
    if: github.event_name == 'push' && needs.smoke-test.result == 'success'
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Release olustur
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: KFinans ${{ github.ref_name }}
          generate_release_notes: true
          draft: false
          prerelease: false
          body: |
            ## 🚀 Production Deploy: ${{ github.ref_name }}

            **Canli URL:** https://kfinans.app
            **SonarCloud:** https://sonarcloud.io/dashboard?id=celikada_KFinans
            **Container images:**
            - `ghcr.io/celikada/kfinans-backend:${{ github.ref_name }}`
            - `ghcr.io/celikada/kfinans-frontend:${{ github.ref_name }}`

            Otomatik changelog assagisi GitHub commit history'den uretilmistir.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
