[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kfinans-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]",
    "sqlalchemy[asyncio]>=2.0",
    "alembic",
    "asyncpg",
    "pydantic-settings>=2.0",
    "pydantic[email]",
    "python-jose[cryptography]",
    "bcrypt",
    "cryptography",
    "ccxt",
    "web3>=6.0",
    "httpx",
    "beautifulsoup4",
    "apscheduler>=3.10",
    "anthropic>=0.40",
    "python-multipart",
    "openpyxl>=3.1",
    "xlrd==1.2.0",
    "bip-utils>=2.9",
    "slowapi>=0.1.9",
    "resend>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio",
    "httpx",
    "respx>=0.21",
    "ruff",
    "pytest-cov",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--tb=short",
]
markers = [
    "slow: yavas testler (selectivelye atlanabilir)",
    "external: gercek dis servis cagrisi yapan testler (CI'da atlanir)",
]
filterwarnings = [
    "ignore::DeprecationWarning:websockets.*",
    "ignore::pydantic.PydanticDeprecatedSince20",
]

[tool.coverage.run]
branch = true
source = ["app"]
omit = [
    "app/main.py",
    "app/scheduler.py",
    "*/tests/*",
    "*/__init__.py",
    "*/migrations/*",
]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]
