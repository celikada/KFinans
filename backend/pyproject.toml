[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kfinans-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]",
    "sqlalchemy[asyncio]>=2.0",
    "alembic",
    "asyncpg",
    "pydantic-settings>=2.0",
    "pydantic[email]",
    # SEC-011 (FAZ H): python-jose CVE-2024-33663 / CVE-2024-33664 (algorithm
    # confusion + DoS). 3.3.0+ ile patchlendi; lower-bound zorunlu.
    "python-jose[cryptography]>=3.3.0",
    # bcrypt 4.x serisi: modern bytestring API (3.x ile breaking change).
    # security.py'da hash_password/verify_password 4.x API kullaniyor.
    "bcrypt>=4.0",
    # cryptography 43.x LTS: Fernet (MultiFernet) + AES-GCM primitif'leri.
    # OpenSSL 3.x baglama; eski 41.x altinda CVE-2024-0727 (BIO_new_NDEF).
    "cryptography>=43.0",
    "ccxt",
    "web3>=6.0",
    # httpx 0.27 — HTTP/2 ConnectError handling + AsyncClient lifecycle bug fix.
    "httpx>=0.27",
    "beautifulsoup4",
    "apscheduler>=3.10",
    "anthropic>=0.40",
    # python-multipart CVE-2024-53981 (DoS — boundary parser): 0.0.18+ patched.
    "python-multipart>=0.0.18",
    "openpyxl>=3.1",
    "reportlab>=4.0",
    # Kredi karti ekstresi (PDF) import: PDF -> metin cikarma (deterministik parser).
    "pdfplumber>=0.11",
    # NOTE: xlrd 1.2.0 BILEREK pinli. 2.0+ surumler eski .xls (BIFF) binary
    # destegini kaldirdi; MKK e-Yatirimci .xls export'lari icin alternatif yok.
    # SEC-009 magic-byte gate (validate_excel_upload) ile saldiri yuzeyi azaltildi.
    "xlrd==1.2.0",
    "bip-utils>=2.9",
    "base58>=2.1",
    "substrate-interface>=1.7",
    "slowapi>=0.1.9",
    "resend>=2.0",
    # SEC-003 (FAZ H): slowapi storage_uri="redis://..." icin gerek
    "redis>=5.0",
    # OBS-001 (FAZ H): Sentry exception tracking + OTel distributed tracing.
    # Hepsi opt-in — settings.sentry_dsn / otel_endpoint bos = no-op.
    "sentry-sdk[fastapi]>=2.0",
    "opentelemetry-api>=1.27",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-instrumentation-fastapi>=0.48b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.48b0",
    "opentelemetry-instrumentation-asyncpg>=0.48b0",
    "opentelemetry-instrumentation-httpx>=0.48b0",
    "opentelemetry-exporter-otlp-proto-http>=1.27",
    # SEC (audit #5): zxcvbn password strength scoring (offline; no network)
    "zxcvbn>=4.4.28",
    # SEC (audit #5 MFA): TOTP (RFC 6238) + QR PNG (kullaniciya servis)
    "pyotp>=2.9",
    "qrcode[pil]>=7.4",
    # Web Push (VAPID + payload sifreleme) — tarayici/PWA bildirimleri.
    # py_vapid + http_ece bagimliliklarini icerir.
    "pywebpush>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio",
    "httpx",
    "respx>=0.21",
    "ruff",
    "pytest-cov",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
# 120: modern Python pratiği esnek limit. Bazi uzun string concat
# (email.py HTML template, advisor.py SQL/system prompt, services
# multi-arg call'lar) 160'a kadar cikabilir.
line-length = 160
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]
# E402: alembic env.py + bazi router'larda lazy import kasitli pattern
# F821: SQLAlchemy relationship string type hint'leri ileri-reference;
#       runtime resolve eder (Mapped["User"], Mapped["PortfolioSnapshot"])
ignore = ["E402", "F821"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--tb=short",
]
markers = [
    "slow: yavas testler (selectivelye atlanabilir)",
    "external: gercek dis servis cagrisi yapan testler (CI'da atlanir)",
    "password_policy_enabled: zxcvbn/HIBP policy bypass'ini devre disi birak (audit #5)",
]
filterwarnings = [
    "ignore::DeprecationWarning:websockets.*",
    "ignore::pydantic.PydanticDeprecatedSince20",
]

[tool.coverage.run]
branch = true
source = ["app"]
# Async FastAPI handler gövdeleri SQLAlchemy async (greenlet) bağlamında çalışır;
# greenlet izlemesi olmadan coverage.py bu satırları "çalışmadı" sayar ve API
# katmanı yapay olarak düşük görünür (CI coverage.xml → SonarQube new_coverage).
concurrency = ["greenlet", "thread"]
omit = [
    "app/main.py",
    "app/scheduler.py",
    "*/tests/*",
    "*/__init__.py",
    "*/migrations/*",
]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]
